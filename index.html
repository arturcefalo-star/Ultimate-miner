function mensagemDeLogin(texto,erro=true){

function usuarioEmail(nome){
return nome.toLowerCase()+"@ultimateminer.com";
}

function nomeValido(nome){
return /^[a-zA-Z0-9_]{3,20}$/.test(nome);
}

function bloquearLogin(bloquear){
botaoEntrar.disabled=bloquear;
botaoCriar.disabled=bloquear;
botaoEntrar.textContent=bloquear?"AGUARDE...":"ENTRAR";
}

function comTempoLimite(promessa,ms,etapa){
let temporizador;
return Promise.race([
Promise.resolve(promessa),
new Promise((_,rejeitar)=>{temporizador=setTimeout(()=>{const erro=new Error("Tempo esgotado ao "+etapa+". Verifique a conexão e as configurações do Firebase.");erro.code="app/timeout";rejeitar(erro);},ms);})
]).finally(()=>clearTimeout(temporizador));
}


// SALVAMENTO E CONTAS FIREBASE

function dadosDoJogo(){
return{
moedas,
picaretasCompradas,
mineriosComprados,
picaretaAtual,
minerioAtual,
volumeGeral,
adminDesbloqueado,
codigosUsados,
multiplicadorCompras,
precoMultiplicador,
autoClickerComprado,
autoClickerProComprado,
autoClickerAtivo,
autoClickerProAtivo
};
}

function agendarSalvamentoNuvem(dados){
if(!usuarioAtual||carregandoDados)return;
if(timerSalvamentoNuvem)clearTimeout(timerSalvamentoNuvem);
const id=usuarioAtual.uid;
const copia=JSON.parse(JSON.stringify(dados));
timerSalvamentoNuvem=setTimeout(async()=>{
if(!usuarioAtual||usuarioAtual.uid!==id)return;
try{
await db.collection("jogadores").doc(id).set({
nome:usuarioAtual.displayName||usuarioAtual.email.split("@")[0],
dados:copia,
atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()
},{merge:true});
}catch(error){console.error("Erro ao salvar no Firebase:",error);}
},1000);
}

function salvar(){
const dados=dadosDoJogo();
if(!usuarioAtual||carregandoDados)return;
try{localStorage.setItem("mining_game_save_"+usuarioAtual.uid,JSON.stringify(dados));}catch(e){}
agendarSalvamentoNuvem(dados);
}

function aplicarDados(dados){
moedas=0;
picaretasCompradas=[0];
mineriosComprados=[0];
picaretaAtual=0;
minerioAtual=0;
volumeGeral=1;
adminDesbloqueado=false;
codigosUsados=[];
multiplicadorCompras=0;
precoMultiplicador=100;
autoClickerComprado=false;
autoClickerProComprado=false;
autoClickerAtivo=false;
autoClickerProAtivo=false;

if(!dados||typeof dados!=="object")return;
moedas=Math.max(0,Number(dados.moedas)||0);
picaretasCompradas=Array.isArray(dados.picaretasCompradas)?dados.picaretasCompradas.filter(i=>Number.isInteger(i)&&i>=0&&i<picaretas.length):[0];
mineriosComprados=Array.isArray(dados.mineriosComprados)?dados.mineriosComprados.filter(i=>Number.isInteger(i)&&i>=0&&i<minerios.length):[0];
if(!picaretasCompradas.includes(0))picaretasCompradas.push(0);
if(!mineriosComprados.includes(0))mineriosComprados.push(0);
if(picaretasCompradas.includes(dados.picaretaAtual))picaretaAtual=dados.picaretaAtual;
if(mineriosComprados.includes(dados.minerioAtual))minerioAtual=dados.minerioAtual;
if(Number.isFinite(dados.volumeGeral))volumeGeral=Math.max(0,Math.min(1,dados.volumeGeral));
adminDesbloqueado=false;
codigosUsados=Array.isArray(dados.codigosUsados)?dados.codigosUsados:[];
multiplicadorCompras=Math.max(0,Math.floor(Number(dados.multiplicadorCompras)||0));
precoMultiplicador=Number(dados.precoMultiplicador);
if(!Number.isFinite(precoMultiplicador)||precoMultiplicador<100)precoMultiplicador=100*Math.pow(3,multiplicadorCompras);
autoClickerComprado=!!dados.autoClickerComprado;
autoClickerProComprado=!!dados.autoClickerProComprado;
autoClickerAtivo=!!dados.autoClickerAtivo&&autoClickerComprado;
autoClickerProAtivo=!!dados.autoClickerProAtivo&&autoClickerProComprado;
if(autoClickerAtivo&&autoClickerProAtivo)autoClickerAtivo=false;
}

let entradaEmAndamento=null;
let uidEntradaEmAndamento=null;
let operacaoManualDeConta=false;

function entrarNoJogo(user,nome){
mensagemDeLogin("Conta reconhecida. Carregando seu progresso...",false);
if(entradaEmAndamento&&uidEntradaEmAndamento===user.uid)return entradaEmAndamento;
uidEntradaEmAndamento=user.uid;
entradaEmAndamento=(async()=>{
usuarioAtual=user;
try{
mensagemDeLogin("Conectado! Consultando seus dados salvos...",false);
const ref=db.collection("jogadores").doc(user.uid);
const snap=await comTempoLimite(ref.get(),15000,"consultar os dados da conta");
let dadosConta={};
if(snap.exists){
dadosConta=snap.data().dados||{};
}else{
try{dadosConta=JSON.parse(localStorage.getItem("mining_game_save_"+user.uid)||"{}");}catch(e){dadosConta={};}
await comTempoLimite(ref.set({
nome:nome||user.displayName||user.email.split("@")[0],
dados:dadosConta,
criadoEm:firebase.firestore.FieldValue.serverTimestamp()
},{merge:true}),15000,"criar o registro do jogador");
}
carregandoDados=true;
aplicarDados(dadosConta);
try{localStorage.setItem("mining_game_save_"+user.uid,JSON.stringify(dadosConta));}catch(e){}
carregandoDados=false;
loginModal.style.display="none";
mensagemLogin.textContent="";
senhaLogin.value="";
return true;
}catch(error){
usuarioAtual=null;
carregandoDados=false;
console.error("Erro ao carregar conta:",error);
let detalhe=error.code==="permission-denied"
?"O Firebase bloqueou o acesso aos dados. Verifique as regras do Firestore da coleção jogadores."
:"Erro ao carregar seu progresso: "+(error.message||"falha de conexão");
mensagemDeLogin(detalhe);
return false;
}
})();
return entradaEmAndamento.finally(()=>{
if(uidEntradaEmAndamento===user.uid){
entradaEmAndamento=null;
uidEntradaEmAndamento=null;
}
});
}

async function fazerLogin(){
const nome=nomeLogin.value.trim();
const senha=senhaLogin.value;
if(!nomeValido(nome)){mensagemDeLogin("Use de 3 a 20 letras, números ou _.");return;}
if(!senha){mensagemDeLogin("Digite sua senha.");return;}
bloquearLogin(true);
operacaoManualDeConta=true;
mensagemDeLogin("ETAPA 1/2: conectando à conta...",false);
let avisoLogin=setTimeout(()=>{mensagemDeLogin("Ainda aguardando o Firebase. Se continuar assim, atualize a página e confira se publicou este arquivo novo.");},40000);
try{
const cred=await comTempoLimite(auth.signInWithEmailAndPassword(usuarioEmail(nome),senha),20000,"entrar na conta");
mensagemDeLogin("ETAPA 2/2: conta reconhecida; carregando progresso...",false);
const ok=await entrarNoJogo(cred.user,nome);
if(!ok&&auth.currentUser)await auth.signOut();
}catch(error){
console.error("Erro no login:",error);
mensagemDeLogin(error.code==="auth/user-not-found"||error.code==="auth/wrong-password"||error.code==="auth/invalid-credential"?"Nome ou senha incorretos.":error.code==="app/timeout"?"O Firebase demorou demais para responder. Verifique a internet e tente novamente.":(error.message||"Não foi possível entrar."));
}finally{
clearTimeout(avisoLogin);
operacaoManualDeConta=false;
bloquearLogin(false);
}
}

async function criarConta(){
const nome=nomeLogin.value.trim();
const senha=senhaLogin.value;
if(!nomeValido(nome)){mensagemDeLogin("Use de 3 a 20 letras, números ou _.");return;}
if(senha.length<6){mensagemDeLogin("A senha precisa ter pelo menos 6 caracteres.");return;}
bloquearLogin(true);
operacaoManualDeConta=true;
mensagemDeLogin("Criando sua conta...",false);
let dadosIniciais={};
let legado=null;
try{legado=localStorage.getItem("mining_game_save");if(legado)dadosIniciais=JSON.parse(legado);}catch(e){dadosIniciais={};}
try{
const cred=await comTempoLimite(auth.createUserWithEmailAndPassword(usuarioEmail(nome),senha),20000,"criar a conta no Firebase");
await comTempoLimite(cred.user.updateProfile({displayName:nome}),15000,"salvar o nome da conta");
await comTempoLimite(db.collection("jogadores").doc(cred.user.uid).set({
nome,
dados:dadosIniciais,
criadoEm:firebase.firestore.FieldValue.serverTimestamp()
}),15000,"salvar os dados iniciais no Firestore");
if(legado){try{localStorage.removeItem("mining_game_save");}catch(e){}}
const entrou=await entrarNoJogo(cred.user,nome);
if(entrou)mensagemDeLogin("",false);
else mensagemDeLogin("Sua conta foi criada, mas não foi possível carregar os dados. Entre novamente ou verifique as regras do Firestore.");
}catch(error){
console.error("Erro ao criar conta:",error);
mensagemDeLogin(error.code==="auth/email-already-in-use"?"Esse nome já existe. Use ENTRAR com a senha dessa conta.":error.code==="app/timeout"?"O Firebase demorou demais para responder. A conta pode ter sido criada; tente ENTRAR com esse nome.":"Não foi possível criar a conta: "+(error.message||"erro desconhecido"));
}finally{
operacaoManualDeConta=false;
bloquearLogin(false);
}
}

botaoEntrar.addEventListener("click",fazerLogin);
botaoCriar.addEventListener("click",criarConta);
senhaLogin.addEventListener("keydown",e=>{if(e.key==="Enter")fazerLogin();});

// GERENCIAMENTO DE OUTROS JOGADORES PELO PAINEL ADMIN
async function gerenciarJogador(){
if(!adminDesbloqueado){alert("Desbloqueie o painel usando o código secreto.");return;}
const nome=prompt("Digite o nome exato do jogador:");
if(!nome)return;
const escolha=prompt(`GERENCIAR: ${nome}

1 - Adicionar moedas
2 - Remover moedas
3 - Dar uma picareta específica
4 - Remover uma picareta específica
5 - Dar um minério específico
6 - Remover um minério específico

Digite o número da ação:`);
const operacoes={
"1":["addMoney","Quantidade de moedas para adicionar:"],
"2":["removeMoney","Quantidade de moedas para remover:"],
"3":["givePickaxe","Número da picareta:"],
"4":["removePickaxe","Número da picareta:"],
"5":["giveOre","Número do minério:"],
"6":["removeOre","Número do minério:"]
};
if(!operacoes[escolha])return;
const [acao,pergunta]=operacoes[escolha];
let valor;
if(acao.includes("Pickaxe")){
alert("PICARETAS:\n"+picaretas.map((x,i)=>i+" - "+x[0]).join("\n"));
valor=prompt(pergunta);
}else if(acao.includes("Ore")){
alert("MINÉRIOS:\n"+minerios.map((x,i)=>i+" - "+x[0]).join("\n"));
valor=prompt(pergunta);
}else{
valor=prompt(pergunta);
}
if(valor===null)return;
valor=Number(String(valor).replace(",",".").trim());
if(!Number.isFinite(valor)||valor<0||(acao.includes("Money")&&valor<=0)||(!Number.isInteger(valor)&&!acao.includes("Money"))){
alert("Valor inválido.");return;
}
if(acao.includes("Pickaxe")&&valor>=picaretas.length){alert("Número de picareta inexistente.");return;}
if(acao.includes("Ore")&&valor>=minerios.length){alert("Número de minério inexistente.");return;}
try{
const executar=functions.httpsCallable("adminGerenciarJogador");
const resposta=await executar({adminCode:codigoAdminSessao,nomeJogador:nome.trim(),acao,valor});
alert(resposta.data?.mensagem||"Jogador atualizado com sucesso!");
if(usuarioAtual&&resposta.data?.uid===usuarioAtual.uid&&resposta.data?.dados){
carregandoDados=true;aplicarDados(resposta.data.dados);carregandoDados=false;
}
}catch(error){
alert("Não foi possível gerenciar o jogador. A função segura do Firebase ainda precisa ser publicada. Detalhe: "+(error.message||error));
}
}

// DINHEIRO

function formatarDinheiro(valor){
const unidades=[
[1e33,"Dc"],[1e30,"No"],[1e27,"Oc"],
[1e24,"Sp"],[1e21,"Sx"],[1e18,"Qi"],
[1e15,"Qa"],[1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"K"]
];

for(const [limite,sufixo] of unidades){
if(valor>=limite)return(valor/limite).toFixed(1).replace(/\.0$/,"")+sufixo;
}
return Math.floor(valor).toString();
}

function minerar(){
const recompensaBase=picaretas[picaretaAtual][2]*minerios[minerioAtual][2];
const recompensa=recompensaBase*multiplicadorDinheiro();

moedas+=recompensa;

somMinerar();

recompensaTexto="+"+formatarDinheiro(recompensa);
mostrarRecompensa=true;
tempoRecompensa=Date.now();

diagonal=true;
tempoGolpe=Date.now();

salvar();
}

// DINHEIRO ADMIN

function adicionarDinheiro(){
const resposta=prompt("Quanto dinheiro você quer adicionar?");
if(resposta===null)return;

const valor=Number(resposta.replace(/,/g,"").trim());

if(!Number.isFinite(valor)||valor<=0){
alert("Digite uma quantidade válida.");
return;
}

moedas+=valor;
salvar();
somCompra();
}

function removerDinheiro(){
const resposta=prompt("Quanto dinheiro deseja remover?");
if(resposta===null)return;

const valor=Number(resposta.replace(/,/g,"").trim());

if(!Number.isFinite(valor)||valor<=0){
alert("Quantidade inválida!");
return;
}

if(valor>moedas){
alert("Você não tem esse dinheiro!");
return;
}

moedas-=valor;
salvar();
somClique();
}

function desbloquearPicaretas(){
picaretasCompradas=picaretas.map((item,index)=>index);
salvar();
somRaro();
}

function desbloquearMinerios(){
mineriosComprados=minerios.map((item,index)=>index);
salvar();
somRaro();
}

function desbloquearTudo(){
desbloquearPicaretas();
desbloquearMinerios();
}

function removerPicaretas(){
picaretasCompradas=[0];
picaretaAtual=0;
salvar();
somClique();
}

function removerMinerios(){
mineriosComprados=[0];
minerioAtual=0;
salvar();
somClique();
}

}

if(codigo.length>=4){

adminDesbloqueado=true;
somRaro();
fecharResgate();
alert("Painel administrativo desbloqueado!");
return;
}catch(error){}
}

if(codigosUsados.includes(codigo)){

}

if(codigo==="BETA"){
moedas+=10000;
codigosUsados.push(codigo);
salvar();
somRaro();

}

alert("Código inválido!");
}

// LOJA

function limitarScroll(){
const total=categoria==="picaretas"?picaretas.length-1:minerios.length-1;
scroll=Math.max(0,Math.min(scroll,total-3));
}

function selecionarItem(linha){
const indice=scroll+linha;
if(linha<0||linha>=3)return;

if(categoria==="picaretas"){
const real=indice+1;
if(real>=picaretas.length)return;

const item=picaretas[real];

if(picaretasCompradas.includes(real)){
if(picaretaAtual!==real){
picaretaAtual=real;
somEquipar();
}
}else if(moedas>=item[1]){
moedas-=item[1];
picaretasCompradas.push(real);
picaretaAtual=real;
somCompra();
if(real>=6)somRaro();
}else{
mostrarAviso("SALDO INSUFICIENTE");
}
}else{
const real=indice+1;
if(real>=minerios.length)return;

const item=minerios[real];

if(mineriosComprados.includes(real)){
if(minerioAtual!==real){
minerioAtual=real;
somEquipar();
}
}else if(moedas>=item[1]){
moedas-=item[1];
mineriosComprados.push(real);
minerioAtual=real;
somCompra();
if(real>=6)somRaro();
}else{
mostrarAviso("SALDO INSUFICIENTE");
}
}

salvar();
}

// DESENHO

function retangulo(x,y,w,h,cor,raio=0){
ctx.fillStyle=cor;
ctx.beginPath();
ctx.roundRect(x,y,w,h,raio);
ctx.fill();
}

function texto(txt,x,y,tamanho,cor="#fff",alinhamento="left"){
ctx.fillStyle=cor;
ctx.font="bold "+tamanho+"px Arial";
ctx.textAlign=alinhamento;
ctx.fillText(txt,x,y);
ctx.textAlign="left";
}

function linha(x1,y1,x2,y2,cor,largura){
ctx.strokeStyle=cor;
ctx.lineWidth=largura;
ctx.lineCap="round";
ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.stroke();
}

function brilho(x,y,raio,cor){
ctx.save();
ctx.shadowColor=cor;
ctx.shadowBlur=raio;
ctx.fillStyle=cor;
ctx.beginPath();
ctx.arc(x,y,raio/4,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

function desenharPicaretaPequena(x,y,tamanho,cor,indice){
const c=`rgb(${cor.join(",")})`;

ctx.save();
ctx.translate(x,y);
ctx.scale(tamanho/100,tamanho/100);

ctx.shadowColor=c;
ctx.shadowBlur=indice>=5?12:3;

linha(0,48,0,-25,"#75421f",10);
linha(0,48,0,-25,"#d29a63",3);
linha(-38,-25,38,-25,c,indice>=5?13:10);
linha(-38,-25,-48,-10,c,indice>=5?12:8);
linha(38,-25,48,-10,c,indice>=5?12:8);
linha(-38,-29,38,-29,"rgba(255,255,255,0.7)",2);

if(indice>=6){
linha(-25,-35,-15,-44,c,3);
linha(25,-35,15,-44,c,3);
brilho(0,-25,10,"#fff");
}

if(indice>=15){
linha(-45,-25,-35,-42,"#fff",2);
linha(45,-25,35,-42,"#fff",2);
}

if(indice>=26){
linha(-30,-40,-20,-52,c,4);
linha(30,-40,20,-52,c,4);

ctx.restore();
}

function desenharEngrenagem(x,y){

ctx.translate(x,y);
ctx.strokeStyle="#fff";
ctx.lineWidth=3;

for(let i=0;i<8;i++){
const a=i*Math.PI/4;
linha(

Math.cos(a)*12,
Math.sin(a)*12,

);
}

ctx.beginPath();
ctx.arc(0,0,7,0,Math.PI*2);
ctx.stroke();

ctx.beginPath();
ctx.arc(0,0,2,0,Math.PI*2);
ctx.fillStyle="#fff";
ctx.fill();

ctx.restore();
}

// POSIÇÃO

function posicao(evento){
const r=canvas.getBoundingClientRect();

return{
x:(evento.clientX-r.left)*500/r.width,
y:(evento.clientY-r.top)*300/r.height
};
}

// CLIQUES

canvas.addEventListener("pointerdown",evento=>{
iniciarAudio();

const p=posicao(evento);

// CONFIGURAÇÕES

if(configuracoesAbertas){

if(p.x>=435&&p.x<=463&&p.y>=40&&p.y<=68){
configuracoesAbertas=false;
somFecharLoja();
return;
}

// VOLUME

if(p.x>=80&&p.x<=430&&p.y>=100&&p.y<=145){
volumeArrastando=true;

volumeGeral=Math.max(0,Math.min(1,(p.x-90)/320));

if(masterGain){
masterGain.gain.setTargetAtTime(volumeGeral*1.8,audio.currentTime,0.03);
}

salvar();
canvas.setPointerCapture(evento.pointerId);
return;
}

// AUTO CLICK NORMAL

if(autoClickerComprado&&p.x>=45&&p.x<=455&&p.y>=155&&p.y<=187){
alternarAutoClicker();
return;
}

// AUTO CLICK PRO

if(autoClickerProComprado&&p.x>=45&&p.x<=455&&p.y>=193&&p.y<=225){
alternarAutoClickerPro();
return;
}

// CÓDIGOS

if(p.x>=45&&p.x<=235&&p.y>=238&&p.y<=270){
abrirResgate();
return;
}

// SAIR DA CONTA

if(p.x>=255&&p.x<=455&&p.y>=238&&p.y<=270){
sairDaConta();
return;
}

return;
}

// ADMIN

if(adminAberto){

if(p.x>=435&&p.x<=463&&p.y>=40&&p.y<=68){
adminAberto=false;
somFecharLoja();
return;
}

if(p.y>=105&&p.y<=153){
if(p.x>=55&&p.x<=240){
adicionarDinheiro();
return;
}
if(p.x>=260&&p.x<=445){
desbloquearPicaretas();
return;
}
}

if(p.y>=165&&p.y<=213){
if(p.x>=55&&p.x<=240){
desbloquearMinerios();
return;
}
if(p.x>=260&&p.x<=445){
gerenciarJogador();
return;
}
}

if(p.y>=220&&p.y<=265){
if(p.x>=45&&p.x<=170){
removerDinheiro();
return;
}
if(p.x>=188&&p.x<=313){
removerPicaretas();
return;
}
if(p.x>=331&&p.x<=456){
removerMinerios();
return;
}
}

return;
}

// UPGRADES

if(melhoriasAbertas){

if(p.x>=435&&p.x<=463&&p.y>=40&&p.y<=68){
melhoriasAbertas=false;
somFecharLoja();
return;
}

// MULTIPLICADOR

if(p.x>=340&&p.x<=450&&p.y>=89&&p.y<=123){
comprarMultiplicador();
return;
}

// AUTO CLICKER

if(p.x>=340&&p.x<=450&&p.y>=150&&p.y<=184){
comprarAutoClicker();
return;
}

// AUTO CLICKER PRO

if(p.x>=340&&p.x<=450&&p.y>=211&&p.y<=245){
comprarAutoClickerPro();
return;
}

return;
}

// LOJA

if(lojaAberta){

if(p.x>=435&&p.x<=463&&p.y>=40&&p.y<=68){
lojaAberta=false;
somFecharLoja();
return;
}

if(p.y>=72&&p.y<=100){
if(p.x>=45&&p.x<=220){
categoria="picaretas";
scroll=0;
somClique();
return;
}

if(p.x>=230&&p.x<=405){
categoria="minerios";
scroll=0;
somClique();
return;
}
}

if(p.x>=40&&p.x<=465&&p.y>=102&&p.y<=270){
arrastando=true;
moveuLista=false;
inicioY=p.y;
scrollInicial=scroll;
canvas.setPointerCapture(evento.pointerId);
}

}else{

if(p.x>=450&&p.x<=492&&p.y>=5&&p.y<=35){
configuracoesAbertas=true;
somAbrirLoja();

}else if(adminDesbloqueado&&p.x>=15&&p.x<=145&&p.y>=125&&p.y<=160){
adminAberto=true;
somAbrirLoja();

}else if(p.x>=16&&p.x<=144&&p.y>=170&&p.y<=205){
melhoriasAbertas=true;
somAbrirLoja();

}else if(p.x>=20&&p.x<=140&&p.y>=220&&p.y<=275){
lojaAberta=true;
scroll=0;
somAbrirLoja();

}else{
minerar();
}
}

});

// ARRASTAR

canvas.addEventListener("pointermove",evento=>{

if(volumeArrastando){
const p=posicao(evento);

volumeGeral=Math.max(0,Math.min(1,(p.x-90)/320));

if(masterGain&&audio){
masterGain.gain.setTargetAtTime(volumeGeral*1.8,audio.currentTime,0.03);
}

salvar();
return;
}

if(!arrastando)return;

const p=posicao(evento);
const movimento=inicioY-p.y;

if(Math.abs(movimento)>5)moveuLista=true;

const total=categoria==="picaretas"?picaretas.length-1:minerios.length-1;

scroll=Math.max(
0,
Math.min(scrollInicial+Math.round(movimento/55),total-3)
);

});

// SOLTAR

canvas.addEventListener("pointerup",evento=>{

if(volumeArrastando){
volumeArrastando=false;
salvar();
return;
}

if(!arrastando)return;

const p=posicao(evento);

if(!moveuLista&&p.x>=40&&p.x<=465&&p.y>=105&&p.y<=270){
selecionarItem(Math.floor((p.y-105)/55));
}

arrastando=false;

});

canvas.addEventListener("pointercancel",()=>{
arrastando=false;
volumeArrastando=false;
});

// ROLAGEM

canvas.addEventListener("wheel",evento=>{
if(!lojaAberta)return;

const p=posicao(evento);

if(p.x>=40&&p.x<=465&&p.y>=102&&p.y<=270){
scroll+=evento.deltaY>0?1:-1;
limitarScroll();
}

evento.preventDefault();

},{passive:false});

// TECLADO

document.addEventListener("keydown",evento=>{

if(codigoModalAberto)return;

if(evento.code==="Space"&&!lojaAberta&&!adminAberto&&!configuracoesAbertas&&!melhoriasAbertas){
evento.preventDefault();
iniciarAudio();
minerar();
return;
}

if(!lojaAberta)return;

if(evento.key==="ArrowDown"){
evento.preventDefault();
scroll++;
limitarScroll();
}

if(evento.key==="ArrowUp"){
evento.preventDefault();
scroll--;
limitarScroll();
}

if(evento.key==="ArrowRight"){
evento.preventDefault();
categoria="minerios";
scroll=0;
somClique();
}

if(evento.key==="ArrowLeft"){
evento.preventDefault();
categoria="picaretas";
scroll=0;
somClique();
}

});

// INICIAR JOGO

iniciarSistemaLogin();
desenhar();

</script>
</body>
  </html>
