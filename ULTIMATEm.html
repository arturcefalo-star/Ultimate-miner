ctx.roundRect=function(x,y,w,h,r=0){
const a=Math.max(0,Math.min(r,w/2,h/2));
this.moveTo(x+a,y);
this.lineTo(x+w-a,y);
this.quadraticCurveTo(x+w,y,x+w,y+a);
this.lineTo(x+w,y+h-a);
this.quadraticCurveTo(x+w,y+h,x+w-a,y+h);
this.lineTo(x+a,y+h);
this.quadraticCurveTo(x,y+h,x,y+h-a);
this.lineTo(x,y+a);
this.quadraticCurveTo(x,y,x+a,y);
this.closePath();
};
}

function iniciarAudio(){
if(audioAtivo){
if(audio&&audio.state==="suspended")audio.resume();
return;
}
try{
const A=window.AudioContext||window.webkitAudioContext;
if(!A)return;
audio=new A();
masterGain=audio.createGain();
masterGain.gain.value=volumeGeral;
masterGain.connect(audio.destination);
audioAtivo=true;
if(audio.state==="suspended")audio.resume();
}catch(e){}
}

function tom(freq,duracao,volume,tipo="sine",freqFinal=null,atraso=0){
if(!audioAtivo||!audio)return;
try{
const agora=audio.currentTime+atraso;
const osc=audio.createOscillator();
const ganho=audio.createGain();
osc.type=tipo;
osc.frequency.setValueAtTime(freq,agora);
if(freqFinal!==null)osc.frequency.exponentialRampToValueAtTime(Math.max(1,freqFinal),agora+duracao);
ganho.gain.setValueAtTime(0.0001,agora);
ganho.gain.exponentialRampToValueAtTime(volume,agora+0.01);
ganho.gain.exponentialRampToValueAtTime(0.0001,agora+duracao);
osc.connect(ganho);
ganho.connect(masterGain);
osc.start(agora);
osc.stop(agora+duracao+0.02);
}catch(e){}
}

function ruido(duracao,volume,frequencia=1200,atraso=0){
if(!audioAtivo||!audio)return;
try{
const tamanho=Math.ceil(audio.sampleRate*duracao);
const buffer=audio.createBuffer(1,tamanho,audio.sampleRate);
const dados=buffer.getChannelData(0);
for(let i=0;i<tamanho;i++)dados[i]=Math.random()*2-1;
const fonte=audio.createBufferSource();
const filtro=audio.createBiquadFilter();
const ganho=audio.createGain();
const agora=audio.currentTime+atraso;
fonte.buffer=buffer;
filtro.type="lowpass";
filtro.frequency.value=frequencia;
ganho.gain.setValueAtTime(volume,agora);
ganho.gain.exponentialRampToValueAtTime(0.0001,agora+duracao);
fonte.connect(filtro);
filtro.connect(ganho);
ganho.connect(masterGain);
fonte.start(agora);
fonte.stop(agora+duracao);
}catch(e){}
}

}
}catch(e){}
}

function formatarDinheiro(valor){
const unidades=[
[1e33,"Dc"],[1e30,"No"],[1e27,"Oc"],[1e24,"Sp"],
[1e21,"Sx"],[1e18,"Qi"],[1e15,"Qa"],[1e12,"T"],
[1e9,"B"],[1e6,"M"],[1e3,"K"]
];
for(const [limite,sufixo] of unidades){
if(valor>=limite)return(valor/limite).toFixed(1).replace(/\.0$/,"")+sufixo;
}
return Math.floor(valor).toString();
}

function adicionarDinheiro(){
const resposta=prompt("Quanto dinheiro você quer adicionar?");
if(resposta===null)return;
const valor=Number(resposta.replace(/,/g,"").trim());
if(!Number.isFinite(valor)||valor<=0){
alert("Digite uma quantidade válida maior que zero.");
return;
}
moedas+=valor;
salvar();
somCompra();
alert("Dinheiro adicionado: $ "+formatarDinheiro(valor));
}

function removerDinheiro(){
const resposta=prompt("Quanto dinheiro deseja remover?");
if(resposta===null)return;
const valor=Number(resposta.replace(/,/g,"").trim());
if(!Number.isFinite(valor)||valor<=0){
alert("Digite uma quantidade válida maior que zero.");
return;
}
if(valor>moedas){
alert("Você não tem essa quantidade de dinheiro.");
return;
}
moedas-=valor;
salvar();
somClique();
alert("Dinheiro removido!");
}

function selecionarItem(linha){

picaretasCompradas.push(real);

somCompra();
if(real>=6)somRaro();
}
}else{
const real=indice+1;
if(real>=minerios.length)return;

moedas-=item[1];
mineriosComprados.push(real);
minerioAtual=real;
somCompra();
if(real>=6)somRaro();
}
}
salvar();
}

function retangulo(x,y,w,h,cor,raio=0){
ctx.fillStyle=cor;
ctx.beginPath();
ctx.roundRect(x,y,w,h,raio);
ctx.fill();
}

function texto(txt,x,y,tamanho,cor="#fff",alinhamento="left"){
ctx.fillStyle=cor;
ctx.font="bold "+tamanho+"px Arial";
ctx.textAlign=alinhamento;
ctx.fillText(txt,x,y);
ctx.textAlign="left";
}

function linha(x1,y1,x2,y2,cor,largura){
ctx.strokeStyle=cor;
ctx.lineWidth=largura;
ctx.lineCap="round";
ctx.beginPath();
ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);
ctx.stroke();
}

function brilho(x,y,raio,cor){
ctx.save();
ctx.shadowColor=cor;
ctx.shadowBlur=raio;
ctx.fillStyle=cor;
ctx.beginPath();
ctx.arc(x,y,raio/4,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

ctx.lineWidth=1;
ctx.beginPath();
ctx.roundRect(40,y,425,45,7);
ctx.stroke();

const indiceReal=i+1;
const comprados=categoria==="picaretas"?picaretasCompradas:mineriosComprados;
const atual=categoria==="picaretas"?picaretaAtual:minerioAtual;

if(categoria==="picaretas"){
desenharPicaretaPequena(61,y+24,34,item[3],indiceReal);
texto(item[0],88,y+18,14,"#ffffff");
texto("POWER: "+item[2],88,y+36,12,"#70dcff");
if(indiceReal>=26)texto("NEW",310,y+17,9,"#ffe36e");
}else{
retangulo(49,y+10,25,25,`rgb(${item[3].join(",")})`,5);
retangulo(53,y+13,9,7,"rgba(255,255,255,0.4)",2);
texto(item[0],85,y+18,14,"#ffffff");
texto("MULTIPLIER: "+item[2]+"x",85,y+36,12,"#70dcff");
}

let corBotao,nomeBotao;
if(comprados.includes(indiceReal)){
if(atual===indiceReal){corBotao="#23964d";nomeBotao="EQUIPPED"}
else{corBotao="#2864b4";nomeBotao="EQUIP"}
}else{
corBotao=moedas>=item[1]?"#1e8c46":"#754044";
nomeBotao="$ "+formatarDinheiro(item[1]);
}
retangulo(350,y+7,105,30,corBotao,7);
texto(nomeBotao,402,y+27,12,"#fff","center");
}
ctx.restore();

if(lista.length>3){
retangulo(468,105,4,155,"#414150",3);
const altura=Math.max(20,155*3/lista.length);
const posicao=scroll*(155-altura)/(lista.length-3);
retangulo(468,105+posicao,4,altura,"#64b4ff",3);
}
if(categoria==="picaretas"){
texto(picaretasCompradas.length+"/"+picaretas.length+" UNLOCKED",45,267,10,"#aab5d9");
}else{
texto(mineriosComprados.length+"/"+minerios.length+" UNLOCKED",45,267,10,"#aab5d9");
}
}

retangulo(x,y,w,h,"#10101a",8);
retangulo(x+2,y+2,w-4,h-4,cor,6);
texto(titulo,x+w/2,y+22,13,"#fff","center");
if(subtitulo)texto(subtitulo,x+w/2,y+37,10,"#f0eaff","center");
}

retangulo(25,30,450,250,"#171722",12);
const fundo=ctx.createLinearGradient(25,30,475,280);

fundo.addColorStop(1,"#171722");

botaoAdmin(260,165,185,48,"#bd7625","UNLOCK EVERYTHING","Picaretas + minérios");

botaoAdmin(188,220,125,42,"#bd7625","REMOVE PICKAXES","");
botaoAdmin(331,220,125,42,"#238c57","REMOVE ORES","");

function desenharConfiguracoes(){
retangulo(25,30,450,250,"#171722",12);
const fundo=ctx.createLinearGradient(25,30,475,280);
fundo.addColorStop(0,"#202d49");
fundo.addColorStop(1,"#171722");

texto("VOLUME DOS EFEITOS",250,115,17,"#fff","center");

retangulo(90,140,320,12,"#414150",6);
retangulo(90,140,320*volumeGeral,12,"#42a5ff",6);

}

function desenhar(){
ctx.clearRect(0,0,500,300);
retangulo(0,0,500,300,"#000");

const cor=picaretas[picaretaAtual][3];
const corCSS=`rgb(${cor.join(",")})`;
texto(picaretas[picaretaAtual][0],250,29,20,corCSS,"center");

desenharPicareta();
if(Date.now()-tempoGolpe>=100)diagonal=false;
desenharMinerio();

if(mostrarRecompensa){
texto(recompensaTexto,350,85,25,"#ffdc00");
if(Date.now()-tempoRecompensa>=1000)mostrarRecompensa=false;
}

texto("$ "+formatarDinheiro(moedas),420,288,23,"#ffdc00","right");

retangulo(450,5,42,30,"#343b55",6);
texto("CFG",471,26,13,"#ffffff","center");

const g=ctx.createLinearGradient(20,220,20,275);
g.addColorStop(0,"#54a8ff");
g.addColorStop(0.45,"#2468d8");
g.addColorStop(1,"#123b91");
retangulo(16,216,128,63,"#081a3b",13);
retangulo(19,219,122,57,g,11);
ctx.strokeStyle="#8bc8ff";
ctx.lineWidth=2;
ctx.beginPath();
ctx.roundRect(20,220,120,55,10);
ctx.stroke();
retangulo(29,237,25,19,"#f4c542",4);
retangulo(29,233,25,7,"#ffe58a",3);
linha(41,234,41,256,"#9b6415",2);
texto("SHOP",91,254,21,"#ffffff","center");

if(lojaAberta)desenharLoja();
if(configuracoesAbertas)desenharConfiguracoes();
if(adminAberto)desenharAdmin();

requestAnimationFrame(desenhar);
}

function posicao(evento){
const r=canvas.getBoundingClientRect();
return{
x:(evento.clientX-r.left)*500/r.width,
y:(evento.clientY-r.top)*300/r.height
};
}

canvas.addEventListener("pointerdown",evento=>{
iniciarAudio();
const p=posicao(evento);

if(configuracoesAbertas){
if(p.x>=435&&p.x<=463&&p.y>=40&&p.y<=68){
configuracoesAbertas=false;
somFecharLoja();
return;
}

if(p.x>=80&&p.x<=430&&p.y>=125&&p.y<=175){
volumeArrastando=true;
volumeGeral=Math.max(0,Math.min(1,(p.x-90)/320));
if(masterGain)masterGain.gain.setTargetAtTime(volumeGeral,audio.currentTime,0.03);
salvar();
canvas.setPointerCapture(evento.pointerId);
return;
}

if(p.x>=145&&p.x<=355&&p.y>=205&&p.y<=250){
abrirAdminPorCodigo();
return;
}
return;
}

if(adminAberto){
if(p.x>=435&&p.x<=463&&p.y>=40&&p.y<=68){
adminAberto=false;
somFecharLoja();
return;
}

if(p.y>=105&&p.y<=153){
if(p.x>=55&&p.x<=240){
adicionarDinheiro();
return;
}
if(p.x>=260&&p.x<=445){
desbloquearPicaretas();
return;
}
}

if(p.y>=165&&p.y<=213){
if(p.x>=55&&p.x<=240){
desbloquearMinerios();
return;
}
if(p.x>=260&&p.x<=445){
desbloquearTudo();
return;
}
}

if(p.y>=220&&p.y<=265){
if(p.x>=45&&p.x<=170){
removerDinheiro();
return;
}
if(p.x>=188&&p.x<=313){
removerPicaretas();
return;
}
if(p.x>=331&&p.x<=456){
removerMinerios();
return;
}
}
return;
}

if(lojaAberta){
if(p.x>=435&&p.x<=463&&p.y>=40&&p.y<=68){
lojaAberta=false;
somFecharLoja();
return;
}
if(p.y>=72&&p.y<=100){
if(p.x>=45&&p.x<=220){
categoria="picaretas";scroll=0;somClique();return;
}
if(p.x>=230&&p.x<=405){
categoria="minerios";scroll=0;somClique();return;
}
}
if(p.x>=40&&p.x<=465&&p.y>=102&&p.y<=270){
arrastando=true;
moveuLista=false;
inicioY=p.y;
scrollInicial=scroll;
canvas.setPointerCapture(evento.pointerId);
}
}else{
if(p.x>=450&&p.x<=492&&p.y>=5&&p.y<=35){
configuracoesAbertas=true;
somAbrirLoja();
}else if(p.x>=20&&p.x<=140&&p.y>=220&&p.y<=275){
lojaAberta=true;
scroll=0;
somAbrirLoja();
}else{
minerar();
}
}
});

canvas.addEventListener("pointermove",evento=>{
if(volumeArrastando){
const p=posicao(evento);
volumeGeral=Math.max(0,Math.min(1,(p.x-90)/320));
if(masterGain&&audio){
masterGain.gain.setTargetAtTime(volumeGeral,audio.currentTime,0.03);
}
salvar();
return;
}

if(!arrastando)return;
const p=posicao(evento);
const movimento=inicioY-p.y;
if(Math.abs(movimento)>5)moveuLista=true;
const total=categoria==="picaretas"?picaretas.length-1:minerios.length-1;
scroll=Math.max(0,Math.min(scrollInicial+Math.round(movimento/55),total-3));
});

canvas.addEventListener("pointerup",evento=>{
if(volumeArrastando){
volumeArrastando=false;
salvar();
return;
}
if(!arrastando)return;
const p=posicao(evento);
if(!moveuLista&&p.x>=40&&p.x<=465&&p.y>=105&&p.y<=270){
const linha=Math.floor((p.y-105)/55);
selecionarItem(linha);
}
arrastando=false;
});

canvas.addEventListener("pointercancel",()=>{
arrastando=false;
volumeArrastando=false;
});

canvas.addEventListener("wheel",evento=>{
if(!lojaAberta)return;
const p=posicao(evento);
if(p.x>=40&&p.x<=465&&p.y>=102&&p.y<=270){
scroll+=evento.deltaY>0?1:-1;
limitarScroll();
}
evento.preventDefault();
},{passive:false});

document.addEventListener("keydown",evento=>{
if(evento.code==="Space"&&!lojaAberta&&!adminAberto&&!configuracoesAbertas){
evento.preventDefault();
iniciarAudio();
minerar();
}
});

desenhar();
</script>
